name: Tests & Linting

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Biome
        run: npm run lint

      - name: Type check
        run: npm run type-check

  antipattern-lint:
    # Tier-1 counter: runs eslint-plugin-react-you-might-not-need-an-effect
    # against PR head AND base, HARD-FAILS on any delta > 0, posts a
    # PR comment with the diff.
    #
    # Numeric-compare via bash `-gt` — GitHub Actions template `>`
    # compares strings, so "9" > "13" would return true. Learned that
    # lesson on the wildlife-detector setup.
    #
    # Only meaningful on PRs — pushes to master go through the counts
    # workflow (.github/workflows/antipattern-counts.yml) which records
    # the merged count to .audit/counts.jsonl for the time-series.
    name: React anti-pattern delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Count anti-patterns on PR head
        id: head_count
        run: |
          # `npm run` prefixes stdout with the invoked-script line, so
          # take the LAST line to get a clean numeric count.
          count=$(npm run lint:antipatterns:count --workspace=@adu-dashboard/ui 2>/dev/null | tail -n 1 || echo 0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "PR head: $count you-might-not-need-an-effect findings"
      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
          git checkout refs/remotes/origin/${{ github.base_ref }} -- packages/ui 2>/dev/null || true
      - name: Count anti-patterns on base branch
        id: base_count
        run: |
          # If base doesn't have eslint.config.js yet (first PR
          # introducing this workflow), treat base count as 0 so the
          # delta reflects everything the PR introduces.
          if [ ! -f packages/ui/eslint.config.js ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "Base branch has no eslint.config.js — treating base count as 0"
          else
            count=$(npm run lint:antipatterns:count --workspace=@adu-dashboard/ui 2>/dev/null | tail -n 1 || echo 0)
            echo "count=$count" >> "$GITHUB_OUTPUT"
            echo "Base: $count findings"
          fi
      - name: Fail on delta increase
        # HARD FAIL when the PR adds tier-1 findings. Bash-arithmetic
        # compare so "16" > "13" numerically, not lexically.
        run: |
          head=${{ steps.head_count.outputs.count }}
          base=${{ steps.base_count.outputs.count }}
          echo "Head: $head, Base: $base"
          if [ "$head" -gt "$base" ]; then
            delta=$((head - base))
            echo "::error::Anti-pattern regression: PR adds $delta new react-you-might-not-need-an-effect finding(s). Base=$base Head=$head"
            echo "Run 'npm run lint:antipatterns --workspace=@adu-dashboard/ui' locally to see offending lines."
            exit 1
          fi
          echo "OK — no regression (delta ≤ 0)."
      - name: Comment on delta increase
        if: failure() && steps.head_count.outputs.count > steps.base_count.outputs.count
        uses: actions/github-script@v7
        with:
          script: |
            const head = ${{ steps.head_count.outputs.count }};
            const base = ${{ steps.base_count.outputs.count }};
            const delta = head - base;
            const body = [
              '### Anti-pattern regression detected',
              '',
              `This PR adds **${delta}** new \`react-you-might-not-need-an-effect\` finding${delta === 1 ? '' : 's'}.`,
              '',
              `| Ref | Count |`,
              `|---|---|`,
              `| Base (\`${{ github.base_ref }}\`) | ${base} |`,
              `| PR head | ${head} |`,
              `| **Delta** | **+${delta}** |`,
              '',
              'Run \`npm run lint:antipatterns --workspace=@adu-dashboard/ui\` locally to see the offending lines and fix shape.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install test dependencies
        run: cd tests && npm install
      
      - name: Run unit tests
        run: npm run test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install test dependencies
        run: cd tests && npm install
      
      - name: Install Playwright browsers
        run: cd tests && npx playwright install --with-deps
      
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      
      - name: Start backend server
        run: |
          python3 server.py > /tmp/backend.log 2>&1 &
          sleep 2
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8888/api/data > /dev/null 2>&1; then
              echo "Backend server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Backend server failed to start"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 1
          done
      
      - name: Build React app
        run: npm run build
      
      - name: Start dev server
        run: npm run dev > /tmp/dev.log 2>&1 &
        env:
          VITE_API_URL: http://localhost:8888
      
      - name: Wait for dev server
        run: |
          sleep 3
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Dev server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Dev server failed to start"
              cat /tmp/dev.log
              exit 1
            fi
            sleep 1
          done
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_API_URL: http://localhost:8888
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/test-results/
          retention-days: 30

  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build project
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: packages/ui/dist/
          retention-days: 1
